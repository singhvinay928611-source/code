```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat App</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5e5e5;
        }

        .container {
            width: 400px;
            height: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .header {
            background: #222;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
        }

        #messages {
            height: 450px;
            overflow-y: auto;
            padding: 15px;
            background: #f5f5f5;
        }

        .message {
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            width: fit-content;
            max-width: 80%;
        }

        .my-message {
            margin-left: auto;
            background: #d1ffd6;
        }

        .username {
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        .time {
            font-size: 10px;
            color: gray;
            text-align: right;
        }

        .typing {
            height: 25px;
            padding-left: 15px;
            color: gray;
            font-size: 12px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            gap: 5px;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        💬 My Chat App
    </div>

    <div id="messages">

        <div class="message">

            <div class="username">
                System
            </div>

            Welcome to the chat! 👋

            <div class="time">
                Now
            </div>

        </div>

    </div>

    <div class="typing" id="typing"></div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

    const input =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const typing =
        document.getElementById("typing");


    // Send message
    function sendMessage() {

        const text =
            input.value.trim();

        if (text === "") {
            return;
        }


        addMessage(
            "You",
            text,
            true
        );


        input.value = "";


        // Fake reply
        setTimeout(function() {

            typing.innerText =
                "Bot is typing...";

        }, 300);


        setTimeout(function() {

            typing.innerText = "";

            addMessage(
                "ChatBot",
                getBotReply(text),
                false
            );

        }, 1200);

    }


    // Add message
    function addMessage(
        username,
        text,
        mine
    ) {

        const div =
            document.createElement("div");


        div.className = "message";


        if (mine) {

            div.classList.add(
                "my-message"
            );

        }


        const time =
            new Date()
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        div.innerHTML = `

            <div class="username">
                ${username}
            </div>

            <div>
                ${escapeHTML(text)}
            </div>

            <div class="time">
                ${time}
            </div>

        `;


        messages.appendChild(div);


        messages.scrollTop =
            messages.scrollHeight;

    }


    // Bot replies
    function getBotReply(message) {

        message =
            message.toLowerCase();


        if (
            message.includes("hello") ||
            message.includes("hi")
        ) {

            return "Hello! 👋 How are you?";

        }


        if (
            message.includes("how are you")
        ) {

            return "I'm doing great! 😊";

        }


        if (
            message.includes("name")
        ) {

            return "I'm your ChatBot 🤖";

        }


        if (
            message.includes("bye")
        ) {

            return "Goodbye! 👋";

        }


        if (
            message.includes("help")
        ) {

            return "Sure! What do you need help with?";

        }


        return "That's interesting! Tell me more 😊";

    }


    // Press Enter to send
    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    // Prevent HTML injection
    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
